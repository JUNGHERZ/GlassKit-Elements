# ============================================================
# GlassKit Elements – Version Consistency Check + Pages Deploy
#
# Trigger:  Push/PR auf main
# Zweck:    Die Version steht von Hand im README-Badge, in der SKILL.md-
#           Beschreibung und auf sechs HTML-Seiten (drei plus die deutschen
#           Fassungen). Dazu kommen die CDN-Pins auf GlassKit CSS, die der
#           Peer-Dependency folgen müssen. Beides ist mehrfach auseinander-
#           gelaufen, ohne dass irgendetwas falsch gerendert hätte — die
#           Landingpages standen sechs Versionen zurück, bis es jemandem auffiel.
#
# Pages:    glasskit-elements.jungherz.com wird seit dem 20.09.2026 aus diesem
#           Workflow deployt, nicht mehr über „Deploy from a branch". Dessen
#           interner Trigger hat Pushes auf main ausgelassen (zuletzt v1.13.0
#           am 20.09.2026, im Schwester-Repo GlassKit 7 der letzten 40), ohne
#           Muster und ohne Incident — dieser Workflow lief bei jedem. Der
#           Deploy hängt hinter dem Versionscheck: eine Seite mit veraltetem
#           Badge geht nicht mehr live. Das Artefakt ist der Repo-Stand
#           (dist/ ist eingecheckt), ohne Jekyll dazwischen.
#
# Lokal:    npm run check:versions
#
# Das Skript nutzt nur Node-Bordmittel, daher kein npm install nötig.
# ============================================================

name: Verify Versions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write   # OIDC-Token für actions/deploy-pages

jobs:
  versions:
    name: Documented versions match package.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check versions
        run: npm run check:versions

      - name: The package carries every file it points to
        run: npm run check:package

      # ---- Pages-Artefakt (nur Push auf main, nicht für PRs) ----
      - name: Assemble the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude '_site' ./ _site/
          du -sh _site && ls _site | head -30

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy site to GitHub Pages
    needs: versions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Nie zwei Deploys gleichzeitig; ein laufender wird nicht abgebrochen,
    # damit kein halb ausgelieferter Stand entsteht.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
